<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Favicon animé -->
  <link rel="icon" type="image/gif" href="assets/images/Favicon%20step/ong%20education%20odd%20favicon.gif">
  <link rel="shortcut icon" type="image/gif" href="assets/images/Favicon%20step/ong%20education%20odd%20favicon.gif">
  <title>Contact – ONG EDUCATION ODD</title>

    <!-- CSS global -->
  <link rel="stylesheet" href="assets/css/00-variables.css">
  <link rel="stylesheet" href="assets/css/01-base.css">
  <link rel="stylesheet" href="assets/css/10-layout.css">
  <link rel="stylesheet" href="assets/css/20-header.css">
  <link rel="stylesheet" href="assets/css/21-nav.css">
  <link rel="stylesheet" href="assets/css/90-responsive.css">

  
  <link rel="stylesheet" href="assets/css/pages/contact.css">
</head>

<body>
  <div id="site-header"></div>
  <div class="spacer"></div>
  <main class="contact-page">

    <!-- Section contact -->
    <section class="contact">
      <div class="container">
        <h1>Contactez-nous</h1>
        <p class="contact-subtitle">Pour en savoir plus sur nos initiatives et projets.</p>

        <form class="contact-form">
          <!-- Web3Forms — clé d'accès (les messages arrivent sur codescooper@gmail.com) -->
          <input type="hidden" name="access_key" value="a90299cb-3cd7-4cc5-a78c-f4a7cd39abc0">
          <input type="hidden" name="subject" value="Nouveau message — page Contact education-odd.com">
          <input type="hidden" name="from_name" value="Site ONG EDUCATION ODD">
          <!-- Anti-spam (honeypot) : laissé vide par un humain -->
          <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

          <label>Vos nom et prénom ici</label>
          <input type="text" name="name" placeholder="Entrez vos nom et prénom" required>

          <label>Votre adresse e-mail*</label>
          <input type="email" name="email" placeholder="Entrez votre e-mail" required>

          <label>Votre message ici*</label>
          <textarea name="message" placeholder="Écrivez votre message" required></textarea>

          <div style="margin-top:16px;text-align:center">
            <button class="btn btn-don" type="submit">Soumettre votre message</button>
          </div>
        </form>

        <!-- Infos de contact -->
        <div class="contact-info">
          <div class="info-item">
            <i class="fas fa-phone"></i>
            <div>
              <strong>Téléphone</strong><br>
              <a href="tel:+2250789084487">+225 07 89 08 44 87</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-envelope"></i>
            <div>
              <strong>Email</strong><br>
              <a href="mailto:info@education-odd.com">info@education-odd.com</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-map-marker-alt"></i>
            <div>
              <strong>Localisation</strong><br>
              Abidjan, Côte d'Ivoire
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Suivez-nous -->
    <section class="follow">
      <div class="container">
        <h2>Suivez nous</h2>

        <div class="follow-icons" aria-label="Réseaux sociaux">
          <a href="https://www.facebook.com/p/ONG-Education-ODD-100083027846106/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://www.youtube.com/@ONG-EDUCATION-ODD" target="_blank" rel="noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
          <!-- Comptes non confirmés — réactiver dès qu'ils existent (mettre la vraie URL dans href) :
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
          -->
        </div>
      </div>
    </section>

    <!-- Carte -->
    <section class="map-wrap">
      <div class="container">
        <div class="map-box">
          <!-- Option 1: image temporaire -->
          <!-- <img src="assets/images/map-placeholder.png" alt="Carte"> -->

          <!-- Option 2: Google Maps embed -->
          <iframe
            title="Carte"
            src="https://www.google.com/maps?q=Abidjan&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <!-- Font Awesome (si pas déjà dans header.html) -->
  <script src="https://kit.fontawesome.com/d82e28740c.js" crossorigin="anonymous"></script>

  <script src="assets/js/includes.js"></script>

  <script>
    document.querySelector('.contact-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const btn = form.querySelector('button[type="submit"]');
      const data = new FormData(form);
      if (btn) { btn.disabled = true; }
      try {
        const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: data });
        const json = await res.json();
        if (json.success) {
          alert('Merci pour votre message. Nous vous contacterons bientôt.');
          form.reset();
        } else {
          alert("L'envoi a échoué. Réessayez ou écrivez-nous à info@education-odd.com.");
        }
      } catch (err) {
        alert("Connexion impossible. Réessayez plus tard ou écrivez à info@education-odd.com.");
      } finally {
        if (btn) { btn.disabled = false; }
      }
    });
  </script>
</body>
</html>
