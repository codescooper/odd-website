<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Favicon animé -->
  <link rel="icon" type="image/gif" href="assets/images/Favicon%20step/ong%20education%20odd%20favicon.gif">
  <link rel="shortcut icon" type="image/gif" href="assets/images/Favicon%20step/ong%20education%20odd%20favicon.gif">
  <title>Contact – ONG EDUCATION ODD</title>

    <!-- CSS global -->
  <link rel="stylesheet" href="assets/css/00-variables.css">
  <link rel="stylesheet" href="assets/css/01-base.css">
  <link rel="stylesheet" href="assets/css/10-layout.css">
  <link rel="stylesheet" href="assets/css/20-header.css">
  <link rel="stylesheet" href="assets/css/21-nav.css">
  <link rel="stylesheet" href="assets/css/90-responsive.css">

  
  <link rel="stylesheet" href="assets/css/pages/contact.css">
</head>

<body>
  <div id="site-header"></div>
  <div class="spacer"></div>
  <main class="contact-page">

    <!-- Section contact -->
    <section class="contact">
      <div class="container">
        <h1>Contactez-nous</h1>
        <p class="contact-subtitle">Pour en savoir plus sur nos initiatives et projets.</p>

        <form class="contact-form">
          <label>Vos nom et prénom ici</label>
          <input type="text" placeholder="Entrez vos nom et prénom" required>

          <label>Votre adresse e-mail*</label>
          <input type="email" placeholder="Entrez votre e-mail" required>

          <label>Votre message ici*</label>
          <textarea placeholder="Écrivez votre message" required></textarea>

          <div style="margin-top:16px;text-align:center">
            <button class="btn btn-don" type="submit">Soumettre votre message</button>
          </div>
        </form>

        <!-- Infos de contact -->
        <div class="contact-info">
          <div class="info-item">
            <i class="fas fa-phone"></i>
            <div>
              <strong>Téléphone</strong><br>
              <a href="tel:+2250789084487">+225 07 89 08 44 87</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-envelope"></i>
            <div>
              <strong>Email</strong><br>
              <a href="mailto:info@education-odd.com">info@education-odd.com</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-map-marker-alt"></i>
            <div>
              <strong>Localisation</strong><br>
              Abidjan, Côte d'Ivoire
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Suivez-nous -->
    <section class="follow">
      <div class="container">
        <h2>Suivez nous</h2>

        <div class="follow-icons" aria-label="Réseaux sociaux">
          <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
          <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
          <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        </div>
      </div>
    </section>

    <!-- Carte -->
    <section class="map-wrap">
      <div class="container">
        <div class="map-box">
          <!-- Option 1: image temporaire -->
          <!-- <img src="assets/images/map-placeholder.png" alt="Carte"> -->

          <!-- Option 2: Google Maps embed -->
          <iframe
            title="Carte"
            src="https://www.google.com/maps?q=Abidjan&output=embed"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
          </iframe>
        </div>
      </div>
    </section>

  </main>

  <div id="site-footer"></div>

  <!-- Font Awesome (si pas déjà dans header.html) -->
  <script src="https://kit.fontawesome.com/d82e28740c.js" crossorigin="anonymous"></script>

  <script src="assets/js/includes.js"></script>

  <script>
    document.querySelector('.contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('Merci pour votre message. Nous vous contacterons bientôt.');
    });
  </script>
</body>
</html>
