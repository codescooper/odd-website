<body>
  <div id="site-header"></div>
  <div class="spacer"></div>
  <main class="contact-page">

    <!-- Section contact -->
    <section class="contact">
      <div class="container">
        <h1>Contactez-nous</h1>
        <p class="contact-subtitle">Pour en savoir plus sur nos initiatives et projets.</p>

        <div class="contact-quick-actions">
          <a class="btn btn-don" href="tel:+2250789084487">
            <i class="fas fa-phone"></i>&nbsp; Appeler
          </a>
          <a class="btn btn-whatsapp" target="_blank" rel="noopener"
             href="https://wa.me/2250789084487?text=Bonjour%2C%20je%20vous%20contacte%20depuis%20le%20site%20education-odd.com.">
            <i class="fa-brands fa-whatsapp"></i>&nbsp; WhatsApp
          </a>
        </div>

        <form class="contact-form">
          <input type="hidden" name="access_key" value="a90299cb-3cd7-4cc5-a78c-f4a7cd39abc0">
          <input type="hidden" name="subject" value="Nouveau message — page Contact education-odd.com">
          <input type="hidden" name="from_name" value="Site ONG EDUCATION ODD">
          <!-- Anti-spam (honeypot) : laissé vide par un humain -->
          <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

          <label for="contact-name">Vos nom et prénom*</label>
          <input type="text" id="contact-name" name="name" placeholder="Entrez vos nom et prénom" required>

          <label for="contact-email">Votre adresse e-mail*</label>
          <input type="email" id="contact-email" name="email" placeholder="Entrez votre e-mail" required>

          <label for="contact-message">Votre message*</label>
          <textarea id="contact-message" name="message" placeholder="Écrivez votre message" required></textarea>

          <div style="margin-top:16px;text-align:center">
            <button class="btn btn-don" type="submit">Soumettre votre message</button>
          </div>
        </form>

        <!-- Infos de contact -->
        <div class="contact-info">
          <div class="info-item">
            <i class="fas fa-phone"></i>
            <div>
              <strong>Téléphone</strong><br>
              <a href="tel:+2250789084487">+225 07 89 08 44 87</a>
              &nbsp;·&nbsp;
              <a target="_blank" rel="noopener"
                 href="https://wa.me/2250789084487?text=Bonjour%2C%20je%20vous%20contacte%20depuis%20le%20site%20education-odd.com.">WhatsApp</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-envelope"></i>
            <div>
              <strong>Email</strong><br>
              <a href="mailto:info@education-odd.com">info@education-odd.com</a>
            </div>
          </div>
          <div class="info-item">
            <i class="fas fa-map-marker-alt"></i>
            <div>
              <strong>Localisation</strong><br>
              Abidjan, Côte d'Ivoire
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Suivez-nous -->
    <section class="follow">
      <div class="container">
        <h2>Suivez-nous</h2>

        <div class="follow-icons" aria-label="Réseaux sociaux">
          <a href="https://www.facebook.com/p/ONG-Education-ODD-100083027846106/" target="_blank" rel="noopener" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="https://www.youtube.com/@ONG-EDUCATION-ODD" target="_blank" rel="noopener" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>

          <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>

    <!-- Carte -->

            title="Carte de localisation — Abidjan, Côte d'Ivoire"

  <!-- Font Awesome (si pas déjà dans header.html) -->
  <script src="https://kit.fontawesome.com/d82e28740c.js" crossorigin="anonymous"></script>

  <script>
    document.querySelector('.contact-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.currentTarget;
      const btn = form.querySelector('button[type="submit"]');
      const data = new FormData(form);
      if (btn) { btn.disabled = true; }
      try {
        const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: data });
        const json = await res.json();
        if (json.success) {
          alert('Merci pour votre message. Nous vous contacterons bientôt.');
          form.reset();
        } else {
          alert("L'envoi a échoué. Réessayez ou écrivez-nous à info@education-odd.com.");
        }
      } catch (err) {
        alert("Connexion impossible. Réessayez plus tard ou écrivez à info@education-odd.com.");
      } finally {
        if (btn) { btn.disabled = false; }
      }
    });
  </script>
</body>
