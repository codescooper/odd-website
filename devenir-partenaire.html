  <!-- SEO + partage -->

  <meta property="og:image" content="https://education-odd.com/assets/images/impact.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <meta name="twitter:image" content="https://education-odd.com/assets/images/impact.jpg">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- CSS global -->
  <link rel="stylesheet" href="assets/css/00-variables.css">
  <link rel="stylesheet" href="assets/css/01-base.css">
  <link rel="stylesheet" href="assets/css/10-layout.css">
  <link rel="stylesheet" href="assets/css/20-header.css">
  <link rel="stylesheet" href="assets/css/21-nav.css">
  <link rel="stylesheet" href="assets/css/90-responsive.css">

  <!-- CSS page -->
  <link rel="stylesheet" href="assets/css/pages/partenaire-form.css">

  <script src="https://kit.fontawesome.com/d82e28740c.js" crossorigin="anonymous"></script>
  <script src="assets/js/header.js" defer></script>
  <script src="assets/js/includes.js" defer></script>
</head>

<body>

  <!-- Header injecté -->
  <div id="site-header"></div>
  
  <main class="partner-page">

  <section class="partner-hero">
    <div class="container">
      <h1>Rejoignez nos partenaires engagés</h1>
      <p>
        Vous représentez une entreprise, une fondation ou une institution publique ?
        Devenez acteur du changement aux côtés de l’ONG EDUCATION ODD.
        <br>Remplissez ce formulaire, notre équipe vous contactera rapidement.
      </p>
    </div>
  </section>

  <section class="partner-form-section">
    <div class="container">

      <form class="partner-form">

        <input type="hidden" name="access_key" value="a90299cb-3cd7-4cc5-a78c-f4a7cd39abc0">
        <input type="hidden" name="subject" value="Nouvelle demande de partenariat — education-odd.com">
        <input type="hidden" name="from_name" value="Site ONG EDUCATION ODD">
        <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

        <label>
          Nom de l’organisation*
          <input type="text" name="Organisation" required>
        </label>

        <label>
          Nom et prénom du référent*
          <input type="text" name="Référent" required>
        </label>

        <label>
          Fonction dans l’organisation
          <input type="text" name="Fonction">
        </label>

        <label>
          Adresse email professionnelle*
          <input type="email" name="email" required>
        </label>

        <label>
          Numéro de téléphone / WhatsApp*
          <input type="tel" name="Téléphone" required>
        </label>

        <fieldset class="partner-types">
          <legend>Type de partenariat envisagé</legend>

          <label><input type="checkbox" name="Type de partenariat" value="Soutien financier"> Soutien financier</label>
          <label><input type="checkbox" name="Type de partenariat" value="Partenariat logistique"> Partenariat logistique (matériel, transport…)</label>
          <label><input type="checkbox" name="Type de partenariat" value="Appui pédagogique ou éducatif"> Appui pédagogique ou éducatif</label>
          <label><input type="checkbox" name="Type de partenariat" value="Communication et sensibilisation"> Communication et sensibilisation</label>
          <label><input type="checkbox" name="Type de partenariat" value="Autre"> Autre (à préciser)</label>
        </fieldset>

        <label>
          Message*
          <textarea rows="5" name="message" required></textarea>
        </label>

        <button type="submit" class="btn-primary">
          Envoyer ma demande de partenariat
        </button>

      </form>

    </div>
  </section>

</main>

<!-- Footer injecté -->
<div id="site-footer"></div>

<script>
  document.querySelector('.partner-form')?.addEventListener('submit', async function (e) {
    e.preventDefault();
    const form = e.currentTarget;
    const btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;
    try {
      const res = await fetch('https://api.web3forms.com/submit', { method: 'POST', body: new FormData(form) });
      const json = await res.json();
      if (json.success) { alert('Merci ! Votre demande de partenariat a bien été envoyée.'); form.reset(); }
      else { alert("L'envoi a échoué. Réessayez ou écrivez-nous à info@education-odd.com."); }
    } catch (err) {
      alert('Connexion impossible. Réessayez plus tard ou écrivez à info@education-odd.com.');
    } finally {
      if (btn) btn.disabled = false;
    }
  });
</script>
</body>
</html>
